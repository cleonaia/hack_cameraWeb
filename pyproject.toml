[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malcolm-security-suite"
version = "2026.1.0"
description = "Modern Network Security, ARP Spoofing & Camera Recon Suite"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Security Research Lab" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS"
]
dependencies = [
    "scapy>=2.8.0,<3",
    "rich>=13.7.0",
    "cryptography>=42.0.0",
    "click>=8.1.7",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
]

[project.scripts]
camera-recon = "tools.camera_recon:main"
arp-poison = "tools.arp_poison:main"
tls-shell = "tools.tls_shell:main"

[tool.setuptools.packages.find]
include = ["tools*"]
namespaces = true
