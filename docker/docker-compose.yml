name: ft-malcolm-lab

services:
  # Attacker node where ft_malcolm runs
  attacker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: malcolm_attacker
    volumes:
      - ../src:/workspace/src:ro
      - ../include:/workspace/include:ro
      - ../Makefile:/workspace/Makefile:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
      - /run:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    networks:
      malcolm_net:
        ipv4_address: 10.42.0.100
        mac_address: 'aa:bb:cc:dd:ee:10'
    stdin_open: true
    tty: true
    command: /bin/bash

  # Victim target node receiving poisoned ARP
  victim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: malcolm_victim
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    networks:
      malcolm_net:
        ipv4_address: 10.42.0.20
        mac_address: 'aa:bb:cc:dd:ee:20'
    stdin_open: true
    tty: true
    command: /bin/bash -c "while true; do ping -c 1 10.42.0.1 >/dev/null 2>&1; sleep 3; done"

  # Simulated Gateway node
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: malcolm_gateway
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      malcolm_net:
        ipv4_address: 10.42.0.1
        mac_address: 'aa:bb:cc:dd:ee:01'
    stdin_open: true
    tty: true
    command: /bin/bash -c "while true; do sleep 3600; done"

networks:
  malcolm_net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.42.0.0/24
          gateway: 10.42.0.254
